<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Помочь Максиму</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Максиму 9 лет, у него ДЦП. Собираем на операцию SDR и SPML в клинике IASO в Афинах, май 2027.">
<!-- Превью ссылки в Телеграме и WhatsApp: картинка, заголовок, описание -->
<meta property="og:title" content="Помогите Максиму сделать шаг">
<meta property="og:description" content="Собираем на операцию SDR и SPML в Афинах, май 2027.">
<meta property="og:image" content="https://maks-go.ru/photos/hero.jpg">
<meta property="og:url" content="https://maks-go.ru/">
<link rel="canonical" href="https://maks-go.ru/">
<meta property="og:type" content="website">
<meta name="theme-color" content="#1d5bc7">
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="hero" id="top">
  <img id="heroImg" src="" alt="">
  <span class="hero-badge" id="heroBadge">Сбор открыт</span>
</header>

<main>
  <div class="wrap">
    <div class="intro" data-track="intro">
      <span class="eyebrow">Сбор на операцию в Греции</span>
      <h1 id="title"></h1>
      <p class="lead" id="headline"></p>
    </div>

    <div class="total" id="total" data-track="total"></div>
  </div>

  <section id="goals-sec" data-track="goals">
    <div class="wrap">
      <h2>На что собираем</h2>
      <div class="goals" id="goals"></div>
      <p class="updated" id="updated"></p>
    </div>
  </section>

  <section id="story-sec" data-track="story">
    <div class="wrap story" id="story"></div>
  </section>

  <section id="clinic-sec" data-track="clinic">
    <div class="wrap" id="clinic"></div>
  </section>

  <section id="doctor-sec" data-track="doctor">
    <div class="wrap" id="doctor"></div>
  </section>

  <section id="photos-sec" data-track="photos">
    <div class="wrap"><h2>Максим в жизни</h2><p class="swipe-hint">Листайте фото пальцем →</p></div>
    <div class="carousel" id="photos"></div>
  </section>

  <section id="video-sec" data-track="video">
    <div class="wrap"><h2>Видео</h2><div class="videos" id="videos"></div></div>
  </section>

  <section id="docs-sec" data-track="docs">
    <div class="wrap"><h2>Документы</h2><p class="swipe-hint">Нажмите на документ, чтобы увеличить</p></div>
    <div class="carousel docs" id="docs"></div>
  </section>

  <section id="help" data-track="payments">
    <div class="wrap">
      <h2>Как помочь</h2>
      <div class="tabs" role="tablist" id="tabs"></div>
      <div id="pay"></div>
    </div>
  </section>

  <section id="links-sec" data-track="links">
    <div class="wrap"><h2>Следить за новостями</h2><div class="links" id="links"></div></div>
  </section>

  <section id="faq-sec" data-track="faq">
    <div class="wrap faq"><h2>Вопросы и ответы</h2><div id="faq"></div></div>
  </section>

  <div class="wrap"><footer id="footer"></footer></div>
</main>

<div class="sticky" id="sticky"><a class="btn btn-primary" href="#help" data-ev="cta_sticky">Помочь Максиму</a></div>

<script src="config.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
